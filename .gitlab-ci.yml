---
# =============================================================================
# Reckonna CD — GitLab side of the hybrid split.
#   CI (tests/lint/sonar/gitleaks) stays on GitHub Actions. Green CI there is
#   the quality gate. This file runs CD (package + deploy to homelab k3s)
#   plus one GitLab-native analysis stage: SAST.
#   Trigger: GitHub `mirror-gitlab` job push-mirrors main here AFTER CI green.
#   No test suites run here — that duplicates GitHub CI. SAST is the only
#   exception: it analyzes (Go, TS/JS, k8s manifests) and reports to the
#   GitLab Security Dashboard, but never blocks delivery (advisory).
# Secrets policy: NO secrets in this file. Repo-wide rule
#   (.claude/rules/secrets-vault.md) is Vault-only; while Vault is down the
#   GitLab side deviates (documented in docs/gitlab-pipeline.md):
#   secrets arrive as masked+protected CI/CD variables (KUBECONFIG, file
#   type). No functional Vault step remains in this pipeline.
# =============================================================================

workflow:
  rules:
    # Two kinds of pipeline, nothing else: main pushes (the pull mirror lands
    # here) and merge-request pipelines (the CI gate before merge). Blocks
    # tags, schedules, and stray branch pushes — also the CI-minutes budget
    # lever (docs/gitlab-pipeline.md).
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - test      # native SAST, advisory — findings land in the Security Dashboard
  - package   # build shippable artifacts (backend OCI image, frontend bundle)
  - deploy    # ship to homelab k3s

# SAST override: the template cannot know local runner facts.
sast:
  stage: test
  tags: [homelab]
  allow_failure: true   # advisory mode — a red analyzer never blocks delivery

# Secret Detection override: same reason — the template job is untagged and
# would never be claimed by the homelab-tagged runner.
secret_detection:
  stage: test
  tags: [homelab]

variables:
  # Registry decision (docs/gitlab-pipeline.md): GitLab built-in
  # container registry. Package jobs authenticate with $CI_JOB_TOKEN —
  # automatic, job-scoped, no extra CI/CD variables.
  IMAGE_REGISTRY: "$CI_REGISTRY"
  COMMAND_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH/command"
  QUERY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH/query"
  FRONTEND_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH/frontend"
  # Mirror keeps full history; SHA is the deploy contract with GitHub CI.
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# BACKEND — Go 1.23, two services: cmd/command + cmd/query
# Build strategy (docs/gitlab-pipeline.md): kaniko — purpose-built for
# building images inside a CI container. No daemon, no privileged mode, no
# user namespaces (buildah needs unshare(CLONE_NEWUSER), which the docker
# executor blocks).
# -----------------------------------------------------------------------------
package:backend:
  stage: package
  tags: [homelab]
  # kaniko's ENTRYPOINT is the executor binary; clear it so the runner's
  # shell can execute the script (the executor is called explicitly).
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  # Backend Go code isn't on this branch yet (cmd/command + cmd/query are
  # empty; code lives in the backend-03 worktree). Skip the job until it
  # lands — the pipeline stays green instead of building nothing.
  rules:
    - exists: [cmd/command/main.go, cmd/query/main.go]
  script:
    # Registry auth is automatic: CI_JOB_TOKEN is accepted by the project's
    # own container registry — job-scoped, no extra CI/CD variables.
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_JOB_TOKEN"}}}
      EOF
    - |
      /kaniko/executor --context . \
        --dockerfile build/Dockerfile.command \
        --destination "$COMMAND_IMAGE:$IMAGE_TAG"
    - |
      /kaniko/executor --context . \
        --dockerfile build/Dockerfile.query \
        --destination "$QUERY_IMAGE:$IMAGE_TAG"

deploy:backend:
  stage: deploy
  tags: [homelab]
  image: bitnami/kubectl:1.31
  # Devops rule: `terraform apply` + `kubectl delete` human-only.
  # kustomize apply may stay automated — uncomment for a human gate anyway:
  # when: manual
  script:
    # Kubeconfig = file-type CI/CD variable (masked + protected, created in
    # project settings). $KUBECONFIG expands to the file path — no base64,
    # no fetch step.
    - export KUBECONFIG="$KUBECONFIG"
    # TODO(you): backend Deployment/Service manifests for cmd/command and
    # cmd/query don't exist under infra/k8s yet. Once they land:
    #   cd infra/k8s/reckonna-app
    #   kustomize edit set image backend="$COMMAND_IMAGE:$IMAGE_TAG" \
    #     backend-query="$QUERY_IMAGE:$IMAGE_TAG"
    #   kubectl kustomize . | kubectl apply -f -
    #   kubectl -n reckonna-app rollout status deploy/backend --timeout=120s
    - echo "deploy:backend — waiting on backend k8s manifests"

# -----------------------------------------------------------------------------
# FRONTEND — React Native + Expo (web target consolidated from MUI app)
# Artifact strategy (docs/gitlab-pipeline.md): `expo export` static bundle
# → non-root nginx image. No EAS, no EXPO_TOKEN.
# -----------------------------------------------------------------------------
package:frontend-export:
  stage: package
  tags: [homelab]
  image: node:20
  script:
    - npm ci
    - npx expo export --platform web --output-dir dist
  artifacts:
    paths: [dist]
    expire_in: 1 week

package:frontend-image:
  stage: package
  tags: [homelab]
  # kaniko's ENTRYPOINT is the executor binary; clear it so the runner's
  # shell can execute the script (the executor is called explicitly).
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs: ["package:frontend-export"]
  script:
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_JOB_TOKEN"}}}
      EOF
    - |
      /kaniko/executor --context . \
        --dockerfile build/Dockerfile.frontend \
        --destination "$FRONTEND_IMAGE:$IMAGE_TAG"

deploy:frontend:
  stage: deploy
  tags: [homelab]
  image: bitnami/kubectl:1.31
  # when: manual           # optional human gate, same rule as backend
  script:
    - export KUBECONFIG="$KUBECONFIG"
    # TODO(you): the web-harness Deployment mounts configmap content, so an
    # image override alone won't serve dist/. Rework the harness (or add a
    # frontend Deployment) first, then:
    #   cd infra/k8s/reckonna-app
    #   kustomize edit set image reckonna-app="$FRONTEND_IMAGE:$IMAGE_TAG"
    #   kubectl kustomize . | kubectl apply -f -
    - echo "deploy:frontend — waiting on web-harness rework"
