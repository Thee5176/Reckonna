    # needs EXPO_TOKEN from Vault). npm ci first either way.
    - echo "package:frontend — write me"

deploy:frontend:
  stage: deploy
  tags: [homelab]
  image: bitnami/kubectl:1.31
  # when: manual           # optional human gate, same rule as backend
  script:
