apiVersion: apps/v1
kind: Deployment
metadata:
  name: reckonna-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reckonna-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reckonna-app
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:alpine
          # Hardened while keeping the official image's root-master/nginx-worker model
          # (IT7 keeps port 80): master needs CHOWN/SETGID/SETUID to drop to the worker
          # user and NET_BIND_SERVICE for :80; everything else is dropped and privilege
          # escalation is disabled. Full non-root (nginx-unprivileged, port 8080) is a
          # tracked follow-up since it changes the IT7 probe contract.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          # IT7: readiness AND liveness both hit /healthz:80 (HTTP). Readiness gates the
          # Service endpoints so cloudflared never routes to a not-yet-ready pod (cold-start
          # 502 fix / P1 ingress-ordering).
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: reckonna-app-content
        - name: nginx-conf
          configMap:
            name: reckonna-app-nginx
