apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules at all: cloudflared is outbound-only (it dials Cloudflare's edge);
  # nothing in the cluster should ever connect TO it.
  ingress: []
  egress:
    # DNS to kube-dns.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Vault Agent init renders the tunnel token.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
    # The tunnel itself: TLS to the Cloudflare edge (anycast IPs vary — port-scoped only),
    # plus the in-cluster route to the reckonna-app Service on 8080.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: reckonna-app
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 7844
